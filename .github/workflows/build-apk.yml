name: Build Ambiorix Pay APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Crear una GitHub Release con el APK'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APKs for clear identification
        run: |
          mkdir -p final-apks
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk final-apks/AmbiorixPay-Debug.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk final-apks/AmbiorixPay-Release.apk
          fi
          ls -la final-apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmbiorixPay-Debug-APK
          path: final-apks/AmbiorixPay-Debug.apk
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmbiorixPay-Release-APK
          path: final-apks/AmbiorixPay-Release.apk
          if-no-files-found: warn

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: AmbiorixPay-All-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (on tag or manual release)
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            final-apks/AmbiorixPay-Debug.apk
            final-apks/AmbiorixPay-Release.apk
          name: Ambiorix Pay ${{ github.ref_name }}
          body: |
            ## Ambiorix Pay APK
            Versión compilada automáticamente con soporte para:
            - Servicio ENCENDIDO / APAGADO
            - Programación de Horarios Comerciales
            - Acumulado Diario y Prevención de Duplicados
            - Importación de Códigos QR (QR 1 y QR 2) desde la galería
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
